name: Branch Name Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name pattern
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch name: ${BRANCH_NAME}"
          # Allowed patterns: feat/*, fix/*, chore/*, hotfix/*
          if [[ ! "${BRANCH_NAME}" =~ ^(feat|fix|chore|hotfix)/[a-z0-9._-]+$ ]]; then
            echo "Invalid branch name: ${BRANCH_NAME}"
            echo "Use one of: feat/<name>, fix/<name>, chore/<name>, hotfix/<name>"
            exit 1
          fi
          echo "Branch name is valid."
